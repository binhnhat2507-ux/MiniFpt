name: JavaFX build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify
      - run: xvfb-run -a ./mvnw -B -Dtest=JavaFxSmokeTest -Dminiftp.uiSmoke=true -Dprism.order=sw test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-screenshots
          path: |
            target/surefire-reports/
            target/screenshots/
